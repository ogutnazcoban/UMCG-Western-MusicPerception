<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Ses Hoşluk, Uyum ve Hareket Etme İsteği Testi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Righteous&display=swap" rel="stylesheet">

  <!-- jsPsych -->
  <link href="jspsych/css/jspsych.css" rel="stylesheet" />
  <script src="jspsych/dist/jspsych.js"></script>
  <script src="jspsych/plugins/plugin-preload.js"></script>
  <script src="jspsych/plugins/plugin-html-button-response.js"></script>
  <script src="jspsych/plugins/plugin-survey-html-form.js"></script>

  <style>
    :root {
      --bg:       #f0f4ff;
      --card:     #ffffff;
      --accent1:  #6c63ff;
      --accent2:  #ff6b9d;
      --accent3:  #43d9a2;
      --accent4:  #ffb347;
      --text:     #1e1b4b;
      --muted:    #6b7280;
      --radius:   20px;
      --shadow:   0 8px 32px rgba(108,99,255,0.13);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--accent1);
      top: -200px; left: -200px;
      animation: blobA 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -150px; right: -150px;
      animation: blobB 14s ease-in-out infinite alternate;
    }
    @keyframes blobA { to { transform: translate(80px, 60px) scale(1.1); } }
    @keyframes blobB { to { transform: translate(-60px, -40px) scale(1.15); } }

    #jspsych-target {
      position: relative; z-index: 1;
      width: 100%; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }

    .jspsych-content-wrapper {
      width: 100% !important;
      max-width: 820px !important;
      margin: 0 auto !important;
    }
    .jspsych-content {
      max-width: 100% !important;
      width: 100% !important;
      text-align: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 44px 48px;
      animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .display {
      font-family: 'Righteous', cursive;
      font-size: 2.4rem;
      color: var(--accent1);
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .jspsych-btn {
      font-family: 'Nunito', sans-serif !important;
      font-size: 1.1rem !important;
      font-weight: 800 !important;
      background: var(--accent1) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 50px !important;
      padding: 14px 40px !important;
      cursor: pointer !important;
      transition: transform .15s, box-shadow .15s !important;
      box-shadow: 0 4px 18px rgba(108,99,255,.35) !important;
      margin-top: 24px !important;
    }
    .jspsych-btn:hover:enabled {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 28px rgba(108,99,255,.45) !important;
    }
    .jspsych-btn:disabled {
      background: #c7c4e8 !important;
      color: #f0f0f0 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 28px 0;
      text-align: left;
    }
    .info-card {
      background: #f5f3ff;
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 18px 20px;
    }
    .info-card .ic-icon { font-size: 2rem; margin-bottom: 8px; }
    .info-card .ic-title { font-weight: 800; color: var(--accent1); margin-bottom: 6px; font-size: 1rem; }
    .info-card .ic-body  { font-size: .9rem; color: var(--muted); line-height: 1.55; }

    .slider-block {
      background: #f8f7ff;
      border: 2px solid #e9e4ff;
      border-radius: 16px;
      padding: 24px 28px;
      margin: 22px 0;
      text-align: left;
    }
    .slider-question {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }
    .emoji-scale {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 2rem;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .emoji-scale span { flex:1; text-align:center; transition: transform .15s; }

    /* number scale for non-pleasantness ratings */
    .number-scale {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent1);
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .number-scale span { flex:1; text-align:center; }

    .scale-endpoints {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      border-radius: 11px;
      border: 2px solid #d1d5f0;
      outline: none;
      margin-top: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }
    input[type=range]:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* pleasantness slider: colorful gradient + note thumb */
    input[type=range].pleasant-slider {
      background: linear-gradient(to right, #ff6b9d, #ffb347, #43d9a2);
    }
    input[type=range].pleasant-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent1);
      box-shadow: 0 3px 12px rgba(108,99,255,.3);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="38">🎵</text></svg>');
      background-size: 65%;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    input[type=range].pleasant-slider:not(:disabled)::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 5px 18px rgba(108,99,255,.45);
    }

    /* number slider: neutral gradient + puzzle thumb */
    input[type=range].number-slider {
      background: linear-gradient(to right, #e2e8f0, #cbd5e1, #94a3b8, #cbd5e1, #e2e8f0);
    }
    input[type=range].number-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent1);
      box-shadow: 0 3px 12px rgba(108,99,255,.3);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="38">🧩</text></svg>');
      background-size: 65%;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    input[type=range].number-slider:not(:disabled)::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 5px 18px rgba(108,99,255,.45);
    }

    .slider-value-label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--accent1);
      text-align: center;
      min-height: 20px;
      margin-top: 2px;
    }

    .audio-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 50px;
      padding: 10px 24px;
      font-weight: 700;
      color: #92400e;
      font-size: .95rem;
      margin: 0 auto 22px;
      width: fit-content;
    }
    .audio-status.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #14532d;
    }
    .wave {
      display: flex; gap: 3px; align-items: flex-end; height: 20px;
    }
    .wave span {
      display: block; width: 4px; border-radius: 2px;
      background: #f97316;
      animation: wave .7s ease-in-out infinite alternate;
    }
    .wave span:nth-child(2) { animation-delay: .12s; }
    .wave span:nth-child(3) { animation-delay: .24s; }
    .wave span:nth-child(4) { animation-delay: .36s; }
    .wave span:nth-child(5) { animation-delay: .48s; }
    @keyframes wave {
      from { height: 4px; }
      to   { height: 18px; }
    }

    .play-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent1);
      color: #fff;
      border-radius: 50px;
      padding: 4px 14px;
      font-size: .82rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      text-align: left;
      margin: 24px 0;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      font-size: .9rem; font-weight: 700; color: var(--text);
    }
    .form-field input {
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #f8faff;
      color: var(--text);
      transition: border-color .2s;
    }
    .form-field input:focus {
      outline: none;
      border-color: var(--accent1);
      background: #fff;
    }
    .req { color: var(--accent2); }

    .tip-box {
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: .92rem;
      color: #14532d;
      font-weight: 600;
      margin: 20px 0 0;
      text-align: left;
    }

    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 4px;
      transition: width .4s ease;
    }

    .part-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      border-radius: 50px;
      padding: 6px 20px;
      font-size: .9rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .practice-steps {
      display: flex; flex-direction: column; gap: 14px;
      text-align: left; margin: 24px 0;
    }
    .step-row {
      display: flex; align-items: flex-start; gap: 14px;
      background: #f8f7ff;
      border: 2px solid #e9e4ff;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .step-num {
      min-width: 32px; height: 32px;
      background: var(--accent1); color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: .95rem;
      flex-shrink: 0;
    }
    .step-text { font-size: .95rem; line-height: 1.55; color: var(--text); }
    .step-text b { color: var(--accent1); }

    .demo-slider-wrap {
      background: #fff;
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 22px 24px;
      margin: 20px 0;
    }
    .demo-slider-wrap .slider-question { font-size: .95rem; }

    /* audio example buttons */
    .example-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f5f3ff;
      border: 2px solid #ddd6fe;
      border-radius: 12px;
      padding: 10px 18px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      color: var(--accent1);
      cursor: pointer;
      transition: background .15s, transform .12s;
      margin: 6px;
    }
    .example-btn:hover { background: #ede9fe; transform: translateY(-1px); }
    .example-btn.playing { background: #ddd6fe; }

    @media (max-width: 640px) {
      .card { padding: 28px 20px; }
      .info-grid, .form-grid { grid-template-columns: 1fr; }
      .display { font-size: 1.8rem; }
      .emoji-scale { font-size: 1.5rem; }
    }

    audio { display: none; }
  </style>
</head>

<body>
  <div id="jspsych-target"></div>

<script>
/* ── helpers ── */
function card(inner) {
  return `<div class="card">${inner}</div>`;
}

const jsPsych = initJsPsych({
  display_element: 'jspsych-target',
  on_finish: () => {
    const sid = jsPsych.data.get().first(1).values()[0].participant_id || 'UNKNOWN';
    const dateStr = new Date().toISOString().split('T')[0];
    const filename = `pleasantness_consonance_groove_${sid}_${dateStr}.csv`;
    jsPsych.data.get().localSave('csv', filename);
  }
});

/* ── Welcome ── */
const startScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: card(`
    <div class="display">🎶 Hoş Geldin!</div>
    <p class="lead">Bu etkinlikte kısa sesler dinleyecek ve onları değerlendireceğiz.<br>Hiç yanlış cevap yok — sadece <b>sana nasıl hissettirdiğini</b> söylemen yeterli!</p>

    <div class="info-grid">
      <div class="info-card">
        <div class="ic-icon">🎵</div>
        <div class="ic-title">1. Bölüm — Sesler</div>
        <div class="ic-body">İki ya da üç nota birlikte çalacak. Her ses iki kez tekrarlanacak.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">🥁</div>
        <div class="ic-title">2. Bölüm — Ritimler</div>
        <div class="ic-body">Farklı ritim kalıpları duyacaksın.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">🎚️</div>
        <div class="ic-title">Nasıl puanlarsın?</div>
        <div class="ic-body">Her sesin ardından iki kaydırıcı çıkar. Düğmeyi sürükleyerek puanını ver.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">⏱️</div>
        <div class="ic-title">Ne kadar sürer?</div>
        <div class="ic-body">Yaklaşık <b>20–25 dakika</b>. Acele etmene gerek yok!</div>
      </div>
    </div>

    <div class="tip-box">🎧 Başlamadan önce kulaklığını tak veya ses seviyeni ayarla!</div>
  `),
  choices: ['Başlayalım! 🚀']
};

/* ── Participant Info ── */
const intake = {
  type: jsPsychSurveyHtmlForm,
  preamble: card(`
    <div class="display">📋 Katılımcı Bilgileri</div>
    <p class="lead">Lütfen aşağıdaki bilgileri doldur. <span style="color:var(--accent2)">*</span> olan alanlar zorunludur.</p>
  `),
  html: `
    <div class="form-grid">
      <div class="form-field full">
        <label>Katılımcı Numarası <span class="req">*</span></label>
        <input name="participant_id" type="text" placeholder="ör. K0001" required>
      </div>
      <div class="form-field">
        <label>Yaş <span class="req">*</span></label>
        <input name="age" type="number" min="4" max="99" placeholder="ör. 10" required>
      </div>
      <div class="form-field">
        <label>Cinsiyet <span class="req">*</span></label>
        <input name="gender" type="text" placeholder="ör. Kadın" required>
      </div>
      <div class="form-field">
        <label>Çaldığın enstrüman <span style="color:var(--muted);font-weight:400">(isteğe bağlı)</span></label>
        <input name="instrument" type="text" placeholder="ör. Piyano">
      </div>
      <div class="form-field">
        <label>Ne zamandır çalıyorsun? <span style="color:var(--muted);font-weight:400">(isteğe bağlı)</span></label>
        <div style="display:flex;gap:10px;">
          <input name="years_playing_years"  type="number" min="0" max="30" placeholder="Yıl" style="flex:1">
          <input name="years_playing_months" type="number" min="0" max="11" placeholder="Ay" style="flex:1">
        </div>
      </div>
    </div>
  `,
  button_label: 'Devam Et ➡️',
  on_finish: d => {
    try {
      const r = typeof d.responses === 'string' ? JSON.parse(d.responses) : d.responses;
      const y = Math.max(0, parseInt(r.years_playing_years ?? 0, 10) || 0);
      const m = Math.min(11, Math.max(0, parseInt(r.years_playing_months ?? 0, 10) || 0));
      jsPsych.data.addProperties({
        participant_id: r.participant_id || "",
        age: r.age || "",
        gender: r.gender || "",
        instrument: r.instrument || "",
        years_playing_years: y,
        years_playing_months: m,
        years_playing_total: Number((y + m / 12).toFixed(3))
      });
    } catch(e) { console.warn(e); }
  }
};

/* ── Stimuli ── */
const roots = [45, 57, 69];
const intervals = [
  'unison','minorSecond','majorSecond','minorThird','majorThird',
  'perfectFourth','tritone','perfectFifth','minorSixth','majorSixth',
  'minorSeventh','majorSeventh','octave'
];
const pitch_files = [];
for (const r of roots) {
  for (const itv of intervals) {
    pitch_files.push(`../stimuli_pitch/piano_${r}_${itv}.wav`);
  }
}
const rhythm_names = [
  'minorSecond','majorSecond','minorThird','majorThird','perfectFourth',
  'tritone','perfectFifth','minorSixth','majorSixth','minorSeventh',
  'majorSeventh','octave','minorTriad','majorTriad','diminishedTriad','augmentedTriad'
];
const rhythm_files = rhythm_names.map(n => `../stimuli_rhythm/rhythm_${n}.wav`);

/* audio examples for consonance/dissonance */
const example_consonant = '../stimuli_pitch/piano_57_unison.wav';
const example_dissonant = '../stimuli_pitch/piano_57_tritone.wav';

const preload_all = {
  type: jsPsychPreload,
  audio: [...pitch_files, ...rhythm_files, example_consonant, example_dissonant],
  continue_after_error: true,
  message: card(`<p style="font-size:1.2rem;font-weight:700;color:var(--accent1)">🎵 Sesler yükleniyor, lütfen bekle…</p>`)
};

/* ── Practice Screen ── */
const practice_screen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: card(`
    <div class="part-badge">🗺️ Nasıl Kullanacaksın?</div>
    <div class="display" style="font-size:1.9rem">Kaydırıcıları Tanıyalım!</div>
    <p class="lead">Her ses için iki kaydırıcı göreceksin. Aşağıda nasıl çalıştıklarını anlattık — sonra kendin deneyebilirsin!</p>

    <div class="practice-steps">
      <div class="step-row">
        <div class="step-num">1</div>
        <div class="step-text">🔊 Ses otomatik olarak çalmaya başlar. <b>1. Bölüm'de her ses iki kez çalınır</b> — ikinci çalış bitince kaydırıcılar aktif olur.</div>
      </div>
      <div class="step-row">
        <div class="step-num">2</div>
        <div class="step-text">🧩 <b>Sesler için uyum kaydırıcısı:</b> İki nota birbirine uyumlu muydu, yoksa uyumsuz muydu? Bu kaydırıcıda <b>sayılar (1–7)</b> ve puzzle düğmesi var.
          <br><br>🥁 <b>Ritimler için hareket etme isteği kaydırıcısı:</b> Ritim sende tempo tutma, ayağını vurma ya da hareket etme isteği uyandırdı mı? Bu kaydırıcıda yine <b>sayılar (1–7)</b> kullanılır.
          <br><br>🎵 <b>Hoşluk kaydırıcısı:</b> Bu sesi veya ritmi dinlemek ne kadar hoştu? Bu kaydırıcıda <b>emoji yüzler</b> ve nota düğmesi var.</div>
      </div>
      <div class="step-row">
        <div class="step-num">3</div>
        <div class="step-text">👆 Her iki kaydırıcıyı da <b>orta noktadan hareket ettir</b>. İkisi de oynanmadan "Devam et" butonu aktif olmaz.</div>
      </div>
    </div>

    <p style="font-weight:800;color:var(--accent1);margin-bottom:10px;">🔊 Uyumlu ve uyumsuz ses örneklerini dinle:</p>
    <div style="display:flex;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">
      <button class="example-btn" id="btn-consonant" onclick="
        const a=document.getElementById('ex-consonant');
        a.currentTime=0; a.play();
        this.classList.add('playing');
        a.onended=()=>this.classList.remove('playing');
      ">▶️ Uyumlu (Unison)</button>
      <button class="example-btn" id="btn-dissonant" onclick="
        const a=document.getElementById('ex-dissonant');
        a.currentTime=0; a.play();
        this.classList.add('playing');
        a.onended=()=>this.classList.remove('playing');
      ">▶️ Uyumsuz (Tritone)</button>
    </div>
    <audio id="ex-consonant" src="${example_consonant}"></audio>

/* ── Pitch Trial (consonance + pleasantness) ── */
function makePitchTrial(stimPath, trialIdx, total) {
  const pct = Math.round((trialIdx / total) * 100);

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: card(`
      <div class="part-badge">🎵 Sesler — ${trialIdx + 1} / ${total}</div>

      <div class="progress-wrap">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>

      <audio id="stim" src="${stimPath}"></audio>

      <div id="audio-status" class="audio-status">
        <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
        <span id="status-text">🔊 Birinci dinleme…</span>
        <span class="play-badge">2 kez çalınacak 🔁</span>
      </div>

      <div class="slider-block">
        <div class="slider-question">🧩 Bu ses sence ne kadar <b>uyumluydu</b>?<br><small style="font-weight:600;color:var(--muted)">İki nota birbirine uyuyor muydu?</small></div>
        <div class="scale-endpoints"><span>Hiç uyumlu değil</span><span>Çok uyumlu</span></div>
        <div class="number-scale">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
        </div>
        <input id="slider_consonance" class="number-slider" type="range" min="0" max="6" step="0.01" value="3" disabled>
        <div id="val1" class="slider-value-label">— kaydırıcı aktif değil —</div>
      </div>

      <div class="slider-block">
        <div class="slider-question">🎵 Bu ses sence ne kadar <b>hoştu</b>?<br><small style="font-weight:600;color:var(--muted)">Dinlemekten zevk aldın mı?</small></div>
        <div class="emoji-scale">
          <span>😡</span><span>😠</span><span>😕</span><span>😐</span><span>🙂</span><span>😄</span><span>🤩</span>
        </div>
        <input id="slider_pleasant" class="pleasant-slider" type="range" min="0" max="6" step="0.01" value="3" disabled>
        <div id="val2" class="slider-value-label">— kaydırıcı aktif değil —</div>
      </div>
    `),
    choices: ['Devam et ➡️'],
    on_load: () => {
      const btn    = document.querySelector('.jspsych-btn');
      const audio  = document.getElementById('stim');
      const s1     = document.getElementById('slider_consonance');
      const s2     = document.getElementById('slider_pleasant');
      const status = document.getElementById('audio-status');
      const stxt   = document.getElementById('status-text');
      const v1     = document.getElementById('val1');
      const v2     = document.getElementById('val2');

      const consLabels = ['Hiç uyumlu değil','Uyumlu değil','Pek uyumlu değil','Orta','Biraz uyumlu','Uyumlu','Çok uyumlu'];
      const emojis     = ['😡','😠','😕','😐','🙂','😄','🤩'];
      const pleasLabels = ['Hiç hoş değil','Hoş değil','Pek hoş değil','Orta','Biraz hoş','Hoş','Çok hoş!'];

      btn.disabled = s1.disabled = s2.disabled = true;

      function unlock() {
        s1.disabled = s2.disabled = false;
        status.classList.add('done');
        stxt.textContent = '✅ Dinleme bitti — şimdi değerlendir!';
        v1.textContent = '👆 Kaydırıcıyı hareket ettir';
        v2.textContent = '👆 Kaydırıcıyı hareket ettir';
      }

      function checkBtn() {
        if (!s1.disabled && parseFloat(s1.value) !== 3 && parseFloat(s2.value) !== 3) {
          btn.disabled = false;
        }
      }

      s1.addEventListener('input', () => {
        const idx = Math.min(6, Math.round(parseFloat(s1.value)));
        v1.textContent = (idx+1) + ' — ' + consLabels[idx];
        checkBtn();
      });
      s2.addEventListener('input', () => {
        const idx = Math.min(6, Math.round(parseFloat(s2.value)));
        v2.textContent = emojis[idx] + ' ' + pleasLabels[idx];
        checkBtn();
      });

      audio.play().then(() => {
        audio.onended = () => {
          stxt.textContent = '🔊 İkinci dinleme…';
          setTimeout(() => {
            audio.currentTime = 0;
            audio.play().then(() => {
              audio.onended = unlock;
            }).catch(() => unlock());
          }, 800);
        };
      }).catch(() => unlock());

      btn.addEventListener('click', () => {
        jsPsych.data.addDataToLastTrial({
          consonance:   s1.value,
          pleasantness: s2.value,
          part:         'pitch',
          stimulus:     stimPath
        });
      });
    }
  };
}

      const pleasLabels = ['Hiç hoş değil','Hoş değil','Pek hoş değil','Orta','Biraz hoş','Hoş','Çok hoş!'];

      btn.disabled = s1.disabled = s2.disabled = true;

      function unlock() {
        s1.disabled = s2.disabled = false;
        status.classList.add('done');
        stxt.textContent = '✅ Dinleme bitti — şimdi değerlendir!';
        v1.textContent = '👆 Kaydırıcıyı hareket ettir';
        v2.textContent = '👆 Kaydırıcıyı hareket ettir';
      }

      function checkBtn() {

      }

      s1.addEventListener('input', () => {

/* ── Generate trials ── */
const shuffled_pitch   = jsPsych.randomization.shuffle([...pitch_files]);
const shuffled_rhythm  = jsPsych.randomization.shuffle([...rhythm_files]);

const pitch_trials  = shuffled_pitch.map((f, i) => makePitchTrial(f, i, shuffled_pitch.length));
const rhythm_trials = shuffled_rhythm.map((f, i) => makeRhythmTrial(f, i, shuffled_rhythm.length));

jsPsych.run([

  intake,
  preload_all,

  intro_pitch,
  ...pitch_trials,
  intro_rhythm,
  ...rhythm_trials,

]);
</script>
