<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sound Pleasantness and Consonance Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Righteous&display=swap" rel="stylesheet">

  <!-- jsPsych -->
  <link href="jspsych/css/jspsych.css" rel="stylesheet" />
  <script src="jspsych/dist/jspsych.js"></script>
  <script src="jspsych/plugins/plugin-preload.js"></script>
  <script src="jspsych/plugins/plugin-html-button-response.js"></script>
  <script src="jspsych/plugins/plugin-survey-html-form.js"></script>

  <style>
    :root {
      --bg:       #f0f4ff;
      --card:     #ffffff;
      --accent1:  #6c63ff;
      --accent2:  #ff6b9d;
      --accent3:  #43d9a2;
      --accent4:  #ffb347;
      --text:     #1e1b4b;
      --muted:    #6b7280;
      --radius:   20px;
      --shadow:   0 8px 32px rgba(108,99,255,0.13);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    /* animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--accent1);
      top: -200px; left: -200px;
      animation: blobA 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -150px; right: -150px;
      animation: blobB 14s ease-in-out infinite alternate;
    }
    @keyframes blobA { to { transform: translate(80px, 60px) scale(1.1); } }
    @keyframes blobB { to { transform: translate(-60px, -40px) scale(1.15); } }

    #jspsych-target {
      position: relative; z-index: 1;
      width: 100%; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }

    /* override jsPsych layout */
    .jspsych-content-wrapper {
      width: 100% !important;
      max-width: 820px !important;
      margin: 0 auto !important;
    }
    .jspsych-content {
      max-width: 100% !important;
      width: 100% !important;
      text-align: center;
    }

    /* ── card wrapper ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 44px 48px;
      animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── typography ── */
    .display {
      font-family: 'Righteous', cursive;
      font-size: 2.4rem;
      color: var(--accent1);
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .section-label {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent1);
      margin-bottom: 6px;
    }

    /* ── jsPsych button override ── */
    .jspsych-btn {
      font-family: 'Nunito', sans-serif !important;
      font-size: 1.1rem !important;
      font-weight: 800 !important;
      background: var(--accent1) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 50px !important;
      padding: 14px 40px !important;
      cursor: pointer !important;
      transition: transform .15s, box-shadow .15s !important;
      box-shadow: 0 4px 18px rgba(108,99,255,.35) !important;
      margin-top: 24px !important;
    }
    .jspsych-btn:hover:enabled {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 28px rgba(108,99,255,.45) !important;
    }
    .jspsych-btn:disabled {
      background: #c7c4e8 !important;
      color: #f0f0f0 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      transform: none !important;
    }

    /* ── info cards (welcome screen) ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 28px 0;
      text-align: left;
    }
    .info-card {
      background: #f5f3ff;
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 18px 20px;
    }
    .info-card .ic-icon { font-size: 2rem; margin-bottom: 8px; }
    .info-card .ic-title { font-weight: 800; color: var(--accent1); margin-bottom: 6px; font-size: 1rem; }
    .info-card .ic-body  { font-size: .9rem; color: var(--muted); line-height: 1.55; }

    /* ── slider block ── */
    .slider-block {
      background: #f8f7ff;
      border: 2px solid #e9e4ff;
      border-radius: 16px;
      padding: 24px 28px;
      margin: 22px 0;
      text-align: left;
    }
    .slider-question {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }
    .emoji-scale {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 2rem;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .emoji-scale span { flex:1; text-align:center; transition: transform .15s; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      border-radius: 11px;
      border: 2px solid #d1d5f0;
      background: linear-gradient(to right, #ff6b9d, #ffb347, #43d9a2);
      outline: none;
      margin-top: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }
    input[type=range]:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent1);
      box-shadow: 0 3px 12px rgba(108,99,255,.3);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="38">🎵</text></svg>');
      background-size: 65%;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    input[type=range]:not(:disabled)::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 5px 18px rgba(108,99,255,.45);
    }

    .slider-value-label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--accent1);
      text-align: center;
      min-height: 20px;
      margin-top: 2px;
    }

    /* ── audio playing indicator ── */
    .audio-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 50px;
      padding: 10px 24px;
      font-weight: 700;
      color: #92400e;
      font-size: .95rem;
      margin: 0 auto 22px;
      width: fit-content;
    }
    .audio-status.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #14532d;
    }
    .wave {
      display: flex; gap: 3px; align-items: flex-end; height: 20px;
    }
    .wave span {
      display: block; width: 4px; border-radius: 2px;
      background: #f97316;
      animation: wave .7s ease-in-out infinite alternate;
    }
    .wave span:nth-child(2) { animation-delay: .12s; }
    .wave span:nth-child(3) { animation-delay: .24s; }
    .wave span:nth-child(4) { animation-delay: .36s; }
    .wave span:nth-child(5) { animation-delay: .48s; }
    @keyframes wave {
      from { height: 4px; }
      to   { height: 18px; }
    }

    /* ── play counter badge ── */
    .play-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent1);
      color: #fff;
      border-radius: 50px;
      padding: 4px 14px;
      font-size: .82rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    /* ── form rows ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      text-align: left;
      margin: 24px 0;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      font-size: .9rem; font-weight: 700; color: var(--text);
    }
    .form-field input {
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #f8faff;
      color: var(--text);
      transition: border-color .2s;
    }
    .form-field input:focus {
      outline: none;
      border-color: var(--accent1);
      background: #fff;
    }
    .req { color: var(--accent2); }

    /* ── tip box ── */
    .tip-box {
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: .92rem;
      color: #14532d;
      font-weight: 600;
      margin: 20px 0 0;
      text-align: left;
    }

    /* ── progress bar ── */
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 4px;
      transition: width .4s ease;
    }

    /* ── part badge ── */
    .part-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      border-radius: 50px;
      padding: 6px 20px;
      font-size: .9rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    /* ── practice pad ── */
    .practice-steps {
      display: flex; flex-direction: column; gap: 14px;
      text-align: left; margin: 24px 0;
    }
    .step-row {
      display: flex; align-items: flex-start; gap: 14px;
      background: #f8f7ff;
      border: 2px solid #e9e4ff;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .step-num {
      min-width: 32px; height: 32px;
      background: var(--accent1); color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: .95rem;
      flex-shrink: 0;
    }
    .step-text { font-size: .95rem; line-height: 1.55; color: var(--text); }
    .step-text b { color: var(--accent1); }

    /* interactive demo slider */
    .demo-slider-wrap {
      background: #fff;
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 22px 24px;
      margin: 20px 0;
    }
    .demo-slider-wrap .slider-question { font-size: .95rem; }

    @media (max-width: 640px) {
      .card { padding: 28px 20px; }
      .info-grid, .form-grid { grid-template-columns: 1fr; }
      .display { font-size: 1.8rem; }
      .emoji-scale { font-size: 1.5rem; }
    }

    audio { display: none; }
  </style>
</head>

<body>
  <div id="jspsych-target"></div>

<script>
/* ── helpers ── */
function card(inner) {
  return `<div class="card">${inner}</div>`;
}

/* ── subject id ── */
const generatedSubjectId = 'P' + Math.random().toString(36).slice(2, 10).toUpperCase();

const jsPsych = initJsPsych({
  display_element: 'jspsych-target',
  on_finish: () => {
    const dateStr = new Date().toISOString().split('T')[0];
    const filename = `pleasantness_consonance_${generatedSubjectId}_${dateStr}.csv`;
    jsPsych.data.get().localSave('csv', filename);
  }
});

jsPsych.data.addProperties({ subject_id: generatedSubjectId });

/* ── Welcome ── */
const startScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: card(`
    <div class="display">🎶 Welcome!</div>
    <p class="lead">In this activity, you will listen to short sounds and rate them.<br>There are no right or wrong answers — just tell us <b>how they make you feel</b>!</p>

    <div class="info-grid">
      <div class="info-card">
        <div class="ic-icon">🎵</div>
        <div class="ic-title">Part 1 — Sounds</div>
        <div class="ic-body">Two notes will play together. Each sound will be repeated twice.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">🥁</div>
        <div class="ic-title">Part 2 — Rhythms</div>
        <div class="ic-body">You will hear different rhythmic patterns.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">🎚️</div>
        <div class="ic-title">How do you rate?</div>
        <div class="ic-body">After each sound, two sliders appear. Drag the handle to give your rating.</div>
      </div>
      <div class="info-card">
        <div class="ic-icon">⏱️</div>
        <div class="ic-title">How long does it take?</div>
        <div class="ic-body">About <b>20–25 minutes</b>. Take your time!</div>
      </div>
    </div>

    <div class="tip-box">🎧 Put on your headphones or adjust your volume before starting!</div>
  `),
  choices: ['Let\'s go! 🚀']
};

/* ── Participant Info ── */
const intake = {
  type: jsPsychSurveyHtmlForm,
  preamble: card(`
    <div class="display">📋 Participant Information</div>
    <p class="lead">Please fill in the information below. Fields marked with <span style="color:var(--accent2)">*</span> are required.</p>
  `),
  html: `
    <div class="form-grid">
      <div class="form-field full">
        <label>Full Name <span class="req">*</span></label>
        <input name="fullname" type="text" placeholder="Your full name" required>
      </div>
      <div class="form-field">
        <label>Age <span class="req">*</span></label>
        <input name="age" type="number" min="4" max="99" placeholder="e.g. 10" required>
      </div>
      <div class="form-field">
        <label>Gender <span class="req">*</span></label>
        <input name="gender" type="text" placeholder="e.g. Female" required>
      </div>
      <div class="form-field">
        <label>Instrument you play <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <input name="instrument" type="text" placeholder="e.g. Piano">
      </div>
      <div class="form-field">
        <label>How long have you been playing? <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <div style="display:flex;gap:10px;">
          <input name="years_playing_years"  type="number" min="0" max="30" placeholder="Years" style="flex:1">
          <input name="years_playing_months" type="number" min="0" max="11" placeholder="Months" style="flex:1">
        </div>
      </div>
    </div>
  `,
  button_label: 'Continue ➡️',
  on_finish: d => {
    try {
      const r = typeof d.responses === 'string' ? JSON.parse(d.responses) : d.responses;
      const y = Math.max(0, parseInt(r.years_playing_years ?? 0, 10) || 0);
      const m = Math.min(11, Math.max(0, parseInt(r.years_playing_months ?? 0, 10) || 0));
      jsPsych.data.addProperties({
        fullname: r.fullname || "",
        age: r.age || "",
        gender: r.gender || "",
        instrument: r.instrument || "",
        years_playing_years: y,
        years_playing_months: m,
        years_playing_total: Number((y + m / 12).toFixed(3))
      });
    } catch(e) { console.warn(e); }
  }
};

/* ── Stimuli ── */
const roots = [45, 57, 69];
const intervals = [
  'unison','minorSecond','majorSecond','minorThird','majorThird',
  'perfectFourth','tritone','perfectFifth','minorSixth','majorSixth',
  'minorSeventh','majorSeventh','octave'
];
const pitch_files = [];
for (const r of roots) {
  for (const itv of intervals) {
    pitch_files.push(`../stimuli_pitch/piano_${r}_${itv}.wav`);
  }
}
const rhythm_names = [
  'minorSecond','majorSecond','minorThird','majorThird','perfectFourth',
  'tritone','perfectFifth','minorSixth','majorSixth','minorSeventh',
  'majorSeventh','octave','minorTriad','majorTriad','diminishedTriad','augmentedTriad'
];
const rhythm_files = rhythm_names.map(n => `../stimuli_rhythm/rhythm_${n}.wav`);

const preload_all = {
  type: jsPsychPreload,
  audio: [...pitch_files, ...rhythm_files],
  continue_after_error: true,
  message: card(`<p style="font-size:1.2rem;font-weight:700;color:var(--accent1)">🎵 Loading sounds, please wait…</p>`)
};

/* ── Alıştırma Ekranı ── */
const practice_screen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: card(`
    <div class="part-badge">🗺️ How Does It Work?</div>
    <div class="display" style="font-size:1.9rem">Let's Learn the Sliders!</div>
    <p class="lead">You will see two sliders after each sound. We explained how they work below — then you can try it yourself!</p>

    <div class="practice-steps">
      <div class="step-row">
        <div class="step-num">1</div>
        <div class="step-text">🔊 The sound starts playing automatically. <b>In Part 1, each sound plays twice</b> — the sliders become active after the second playback.</div>
      </div>
      <div class="step-row">
        <div class="step-num">2</div>
        <div class="step-text">🎚️ Two sliders appear:
          <br>• <b>Consonance slider:</b> Did the sound feel consonant or dissonant?
          <br>• <b>Pleasantness slider:</b> How enjoyable was the sound to listen to?
        </div>
      </div>
      <div class="step-row">
        <div class="step-num">3</div>
        <div class="step-text">👆 Move <b>both sliders away from the midpoint (😐)</b>. The "Continue" button will not activate until both have been moved.</div>
      </div>
      <div class="step-row">
        <div class="step-num">4</div>
        <div class="step-text">✅ Once you have set both sliders, press the <b>Continue</b> button.</div>
      </div>
    </div>

    <p style="font-weight:800;color:var(--accent1);margin-bottom:14px;">👇 Try the slider now!</p>

    <div class="demo-slider-wrap">
      <div class="slider-question">🎵 How consonant did this sound feel?</div>
      <div class="emoji-scale">
        <span>😡</span><span>😠</span><span>😕</span><span>😐</span><span>🙂</span><span>😄</span><span>🤩</span>
      </div>
      <input id="demo-slider" type="range" min="0" max="6" step="0.01" value="3">
      <div id="demo-label" class="slider-value-label">← Drag the handle!</div>
    </div>

    <div class="tip-box">💡 <b>Tip:</b> Trust your first impression — don't overthink it, go with what feels right!</div>
  `),
  choices: ['Got it, let\'s start! 🎵'],
  on_load: () => {
    const slider = document.getElementById('demo-slider');
    const label  = document.getElementById('demo-label');
    const emojis = ['😡','😠','😕','😐','🙂','😄','🤩'];
    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      const idx = Math.min(6, Math.round(v));
      label.textContent = emojis[idx] + ' ' + ['Highly dissonant','Dissonant','Slightly dissonant','Neutral','Slightly consonant','Consonant','Highly consonant!'][idx];
    });
  }
};

/* ── Toplam trial sayacı (progress için) ── */
const TOTAL_PITCH   = pitch_files.length;
const TOTAL_RHYTHM  = rhythm_files.length;
let trialCounter = 0;

/* ── Dual Slider Trial ── */
function makeDualSliderTrial(part, stimPath, trialIdx, total) {
  const isPitch   = part === 'pitch';
  const playLabel = isPitch ? 'Plays twice 🔁' : 'Plays once';
  const pct = Math.round((trialIdx / total) * 100);

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: card(`
      <div class="part-badge">${isPitch ? '🎵 Sounds' : '🥁 Rhythms'} — ${trialIdx + 1} / ${total}</div>

      <div class="progress-wrap">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>

      <audio id="stim" src="${stimPath}"></audio>

      <div id="audio-status" class="audio-status">
        <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
        <span id="status-text">${isPitch ? '🔊 First playback…' : '🔊 Playing…'}</span>
        <span class="play-badge">${playLabel}</span>
      </div>

      <div class="slider-block">
        <div class="slider-question">🎵 How <b>consonant</b> was this sound?<br><small style="font-weight:600;color:var(--muted)">${isPitch ? 'Did the two notes sound consonant?' : 'Did this rhythm sound consonant?'}</small></div>
        <div class="emoji-scale" id="eq1">
          <span>😡</span><span>😠</span><span>😕</span><span>😐</span><span>🙂</span><span>😄</span><span>🤩</span>
        </div>
        <input id="slider_consonance" type="range" min="0" max="6" step="0.01" value="3" disabled>
        <div id="val1" class="slider-value-label">— slider not active yet —</div>
      </div>

      <div class="slider-block">
        <div class="slider-question">🌈 How <b>pleasant</b> was this sound?<br><small style="font-weight:600;color:var(--muted)">Did you enjoy listening to it?</small></div>
        <div class="emoji-scale" id="eq2">
          <span>😡</span><span>😠</span><span>😕</span><span>😐</span><span>🙂</span><span>😄</span><span>🤩</span>
        </div>
        <input id="slider_pleasant" type="range" min="0" max="6" step="0.01" value="3" disabled>
        <div id="val2" class="slider-value-label">— slider not active yet —</div>
      </div>
    `),
    choices: ['Continue ➡️'],
    on_load: () => {
      const btn    = document.querySelector('.jspsych-btn');
      const audio  = document.getElementById('stim');
      const s1     = document.getElementById('slider_consonance');
      const s2     = document.getElementById('slider_pleasant');
      const status = document.getElementById('audio-status');
      const stxt   = document.getElementById('status-text');
      const v1     = document.getElementById('val1');
      const v2     = document.getElementById('val2');

      const emojis  = ['😡','😠','😕','😐','🙂','😄','🤩'];
      const labels1 = ['Highly dissonant','Dissonant','Slightly dissonant','Neutral','Slightly consonant','Consonant','Highly consonant!'];
      const labels2 = ['Not pleasant at all','Not pleasant','Slightly unpleasant','Neutral','Slightly pleasant','Pleasant','Very pleasant!'];

      btn.disabled = s1.disabled = s2.disabled = true;

      function unlock() {
        s1.disabled = s2.disabled = false;
        status.classList.add('done');
        stxt.textContent = '✅ Playback done — now rate it!';
        v1.textContent = '👆 Move the slider';
        v2.textContent = '👆 Move the slider';
      }

      function checkBtn() {
        if (!s1.disabled && parseFloat(s1.value) !== 3 && parseFloat(s2.value) !== 3) {
          btn.disabled = false;
        }
      }

      function bindSlider(slider, valEl, labels) {
        slider.addEventListener('input', () => {
          const idx = Math.min(6, Math.round(parseFloat(slider.value)));
          valEl.textContent = emojis[idx] + ' ' + labels[idx];
          checkBtn();
        });
      }
      bindSlider(s1, v1, labels1);
      bindSlider(s2, v2, labels2);

      if (isPitch) {
        audio.play().then(() => {
          audio.onended = () => {
            stxt.textContent = '🔊 Second playback…';
            setTimeout(() => {
              audio.currentTime = 0;
              audio.play().then(() => {
                audio.onended = unlock;
              }).catch(() => unlock());
            }, 800);
          };
        }).catch(() => unlock());
      } else {
        audio.play().then(() => {
          audio.onended = unlock;
        }).catch(() => unlock());
      }

      btn.addEventListener('click', () => {
        jsPsych.data.addDataToLastTrial({
          consonance:   s1.value,
          pleasantness: s2.value,
          part:         part,
          stimulus:     stimPath
        });
      });
    }
  };
}

/* ── Trial'ları üret ── */
